#==========================================
# @ConfigName        自用MihomoParty配置文件
# @Author            @3S-AC
# @UpdateTime        2024/10/06 00:00 UTC/GMT +8
# @Function          支持手动选择、自动测速、兜底分流、按国家分组节点、策略图标等  
# @mihomo-party      https://github.com/mihomo-party-org/mihomo-party/releases
# @howtouse          主界面添加本配置[覆写]，然后使用内置的[SubStore]添加机场，之后去[订阅管理]，在配置的[编辑信息]中绑定机场订阅，开启系统代理即可使用
# @Thanks            @blackmatrix7, @Orz-3
# @ConfigVersion     1.1.3
#==========================================
mixed-port: 7890
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
### 如果使用的是裸核，需要将下面的注释去掉，方便ui界面的使用
# external-ui: ui
# external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'
find-process-mode: strict
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
tun:
  enable: true
  stack: system
  device: mihomo
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
dns:
  enable: true
  ipv6: true
  prefer-h3: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  nameserver:
    - system
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
mode: rule
log-level: warning
ipv6: true
udp: true

proxy-groups:
#分流分组
  - {name: 手动切换, type: select, include-all: true, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png }
  - {name: 全球加速, type: select, proxies: [手动切换, DIRECT, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png }
  - {name: 苹果服务, type: select, proxies: [DIRECT, 手动切换, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Apple.png }
  - {name: OpenAI, type: select, proxies: [美国节点, 手动切换], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png }
  - {name: 微软服务, type: select, proxies: [DIRECT, 手动切换, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png }
  - {name: 电报消息, type: select, proxies: [手动切换, DIRECT, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png }
  - {name: 谷歌服务, type: select, proxies: [手动切换, DIRECT, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png }
  - {name: 兜底分流, type: select, proxies: [手动切换, DIRECT, 自动选择, 官方节点, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png }
  
#节点分组
  - {name: 自动选择, type: url-test, include-all: true, interval: 3600, tolerance: 100,  icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png }
  - {name: 官方节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "官方|移动|联通|电信|IPV6", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/CN.png }             
  - {name: 香港节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "港|HK|(?i)Hong", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png }             
  - {name: 日本节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "日|东京|JP|(?i)Japan", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png }
  - {name: 台湾节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "台|湾|TW|(?i)Taiwan", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png }
  - {name: 美国节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "美|US|(?i)States|American", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png }
  - {name: 狮城节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "新|坡|SG|(?i)Singapore", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png }


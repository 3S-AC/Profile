#==========================================
# @ConfigName        自用MihomoParty配置文件
# @Author            @3S-AC
# @UpdateTime        2025-03 00:00 UTC/GMT +8
# @Function          支持手动选择、自动测速、兜底分流、按国家分组节点、策略图标等  
# @mihomo-party      https://github.com/mihomo-party-org/mihomo-party/releases
# @howtouse          主界面添加本配置[覆写]，然后使用内置的[SubStore]添加机场，之后去[订阅管理]，在配置的[编辑信息]中绑定机场订阅，开启系统代理即可使用
# @Thanks            @blackmatrix7, @Orz-3
# @ConfigVersion     1.1.3
#==========================================
    
proxy-groups:
#分流分组
  - {name: 全球加速, type: url-test, proxies: [香港节点, 日本节点, 新加坡节点, 台湾节点, 美国节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png }
  - {name: 智能助手, type: select, proxies: [美国节点, 全球加速], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png }
  - {name: 兜底分流, type: select, proxies: [全球加速, DIRECT], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png }
  
#节点分组          
  - {name: 香港节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "港|HK|(?i)Hongkong", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png }    
  - {name: 日本节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "日|JP|(?i)Japan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png }     
  - {name: 新加坡节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "新|SG|(?i)Singapore", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png }             
  - {name: 台湾节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "台|TW|(?i)Taiwan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png }
  - {name: 美国节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png }

# 分流规则 
rule-providers:
  Direct:      {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/Direct.yaml ,                                         path: ./ruleset/Direct.yaml       }
  Lan:         {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/Lan.yaml ,                                            path: ./ruleset/Lan.yaml          }
  AI:          {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/AI.yaml ,                                             path: ./ruleset/AI.yaml           }
  Scholar:     {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/Scholar.yaml ,                                        path: ./ruleset/Scholar.yaml      } 
  Apple:       {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/Apple.yaml ,                                          path: ./ruleset/Apple.yaml        }
  CNMedia:     {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/CNMedia.yaml ,                                        path: ./ruleset/CNMedia.yaml      }   
# 分流Policy 
rules:
  - RULE-SET,AI,智能助手
  - RULE-SET,Apple,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Scholar,DIRECT
  - RULE-SET,CNMedia,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流

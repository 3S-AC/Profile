#==========================================
# @ConfigName        自用MihomoParty配置文件
# @Author            @3S-AC
# @UpdateTime        2024/10/06 00:00 UTC/GMT +8
# @Function          支持手动选择、自动测速、兜底分流、按国家分组节点、策略图标等  
# @mihomo-party      https://github.com/mihomo-party-org/mihomo-party/releases
# @howtouse          主界面添加本配置[覆写]，然后使用内置的[SubStore]添加机场，之后去[订阅管理]，在配置的[编辑信息]中绑定机场订阅，开启系统代理即可使用
# @Thanks            @blackmatrix7, @Orz-3
# @ConfigVersion     1.1.3
#==========================================

proxy-groups:
#分流分组
  - {name: 手动切换, type: select, include-all: true, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png }
  - {name: 全球加速, type: select, proxies: [手动切换, 自动选择,  官方节点, 香港节点, 美国节点, 狮城节点], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png }
  - {name: 智能助手, type: select, proxies: [手动切换, 自动选择, 美国节点, 全球加速], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png }
  - {name: 兜底分流, type: select, proxies: [手动切换, 自动选择, 全球加速，DIRECT], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png }
  
#节点分组
  - {name: 自动选择, type: url-test, include-all: true, interval: 600, tolerance: 50,  icon: https://ghfast.top/https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png }
  - {name: 官方节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "移动|联通|电信|IPV6", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/CN.png }             
  - {name: 香港节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "港|HK|(?i)Hong", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png }             
  - {name: 美国节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "美|US|(?i)States|American", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png }
  - {name: 狮城节点, type: url-test, include-all: true, interval: 3600, tolerance: 100,  filter: "新|坡|SG|(?i)Singapore", icon: https://mirror.ghproxy.com/https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png }

# 分流规则 
rule-providers:
  Direct:      {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.yaml ,                path: ./ruleset/Direct.yaml       }
  Lan:         {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml ,                      path: ./ruleset/Lan.yaml          }
  AI:          {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/3S-AC/Mihomo/refs/heads/main/AI.yaml ,                                             path: ./ruleset/AI.yaml           }
  Google:      {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml ,                path: ./ruleset/Google.yaml       }
  Scholar:     {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Scholar/Scholar.yaml ,              path: ./ruleset/Scholar.yaml      } 
  Apple:       {behavior: classical, interval: 86400, format: yaml, type: http, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple_Classical.yaml ,        path: ./ruleset/Apple.yaml        }
    
# 分流Policy 
rules:
  - RULE-SET,AI,智能助手
  - RULE-SET,Google,全球加速
  - RULE-SET,Apple,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Scholar,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流
